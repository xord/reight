name: Release WASM

on:
  push:
    tags: ['v[0-9]*']

permissions:
  contents: write
  id-token: write

jobs:
  wasm:
    runs-on: ubuntu-latest

    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: setup ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: 4.0

      - name: setup xot
        run: git clone -q --depth 1 https://github.com/xord/xot.git "${{ runner.temp }}/xot"

      - name: checkout monorepo
        env:
          RUBYLIB: ${{ runner.temp }}/xot/lib
        run: ruby -rxot/rake -e 'checkout_monorepo'

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: install emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: 5.0.7

      - name: build
        run: cd ../all/reight/wasm && rake build

      - name: upload to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUBYLIB: ../all/xot/lib
        run: ruby -rxot/rake -e 'release_on_github(*Dir.glob("../all/reight/wasm/output/*"))'

      - name: publish to npm
        run: cd ../all/reight/wasm && rake publish
